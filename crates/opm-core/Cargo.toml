[package]
name = "opm-core"
description = "Vendor-agnostic core abstractions for the Open Peripheral Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# General-purpose only — never a transport/HID crate. See
# docs/architecture/overview.md and ADR 0002. `serde` is needed to
# serialize `Identity` for `pmctl discover --export`. `thiserror` backs
# `transport::Error` (see ADR 0003) — neither pulls in a transport
# library.
serde = { version = "1", features = ["derive"] }
thiserror = "2"

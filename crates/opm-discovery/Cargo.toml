[package]
name = "opm-discovery"
description = "HID device enumeration, grouping, and classification for the Open Peripheral Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
opm-core = { path = "../opm-core" }
# Pinned explicitly (not just relying on the crate's own default) per
# docs/architecture/discovery.md: the hidraw backend is required on
# Linux for usage_page/usage to be populated at all, and opening a
# device through the libusb backend detaches the kernel HID driver.
hidapi = { version = "2", default-features = false, features = [
    "linux-static-hidraw",
] }
# Report-descriptor parsing (report IDs), see discovery.md's "What
# information belongs to the HID descriptor?" — a purpose-built parser
# rather than a hand-rolled one.
hidreport = "0.5"
thiserror = "2"
